services:
  conduwuit:
    image: ghcr.io/continuwuity/continuwuity:latest
    container_name: ${COMPOSE_PROJECT_NAME}-conduwuit
    restart: unless-stopped
    ports:
      - "${CONDUWUIT_PORT:-8448}:6167"
    volumes:
      - conduwuit-db:/var/lib/continuwuity
    environment:
      CONTINUWUITY_SERVER_NAME: local
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_PORT: 6167
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_ALLOW_REGISTRATION: "false"
      CONTINUWUITY_ALLOW_FEDERATION: "false"
      CONTINUWUITY_TRUSTED_SERVERS: "[]"
      CONTINUWUITY_MAX_REQUEST_SIZE: 20000000
      CONTINUWUITY_NEW_USER_DISPLAYNAME_SUFFIX: ""
      TZ: Europe/Berlin

  orchestrator:
    build:
      context: ./orchestrator
    container_name: ${COMPOSE_PROJECT_NAME}-orchestrator
    restart: unless-stopped
    ports:
      - "${HOOK_PORT:-4003}:${HOOK_PORT:-4003}"
    # Required for podman socket access on SELinux-enforcing hosts (Fedora CoreOS).
    # Without this, container_t cannot connect to the user_tmp_t-labeled socket
    # and the connection silently fails with EACCES (no audit log entry).
    security_opt:
      - label=disable
    volumes:
      - agent-pool-workspace:/workspace
      - skills-pool:/template-workspace:ro
      # ACE / BriefingPack integration: uncomment when ACE_REPO_PATH is set in .env
      # - ${ACE_REPO_PATH}:/ace:rw
      # Persistent Claude config: stores per-session conversation snapshots
      # (~/.claude/projects/<encoded-cwd>/<sessionId>.jsonl). Without this
      # volume, `--resume <sessionId>` would fail after every container
      # restart because Claude's local session state lives under HOME.
      - claude-home:/root/.claude
      # Control-plane volume (#185): agents PUSH their status + session-log
      # here via the orchestrator's internal API. Mounted on orchestrator +
      # admin-console ONLY (never on agents) so monitoring no longer depends on
      # reading an agent's (soon per-agent) workspace volume.
      - agent-control-plane:/control
      # Optional baseline git identity for the ORCHESTRATOR's OWN git operations
      # (ACE briefings pull + orchestrator-side push/PR fallback). NOT used by
      # agents — each agent gets its per-environment deploy key (Admin Console →
      # SSH Keys). Point ORCHESTRATOR_SSH_KEY at a host private key to enable a
      # baseline identity; leave it unset and the mount resolves to /dev/null (a
      # dud key), so the stack starts with NO host key file present and SSH repos
      # are expected to carry their own deploy key. See .env.example.
      - ${ORCHESTRATOR_SSH_KEY:-/dev/null}:/root/.ssh/id_orchestrator:ro
      # Rootless Podman socket. The default path is the macOS Podman-Desktop
      # value (core user UID 501 inside the podman-machine VM). On Windows
      # Podman Desktop the user is typically UID 1000; on Linux rootless it's
      # `id -u`. Override via PODMAN_HOST_SOCKET in .env. Discover yours with:
      #   podman machine inspect --format '{{.ConnectionInfo.PodmanSocket.Path}}'
      # NOT :ro — orchestrator P3 spawn-container.js needs create/start/kill/wait.
      - ${PODMAN_HOST_SOCKET:-/run/user/501/podman/podman.sock}:/var/run/podman.sock
    environment:
      TZ: Europe/Berlin
      PODMAN_SOCK_PATH: /var/run/podman.sock
      # The same socket as the mount above, but named as the HOST sees it.
      # Needed when the orchestrator bind-mounts the socket into a SIBLING
      # container (plugin broker sidecars, #1547): libpod resolves a bind
      # source on the host, not inside this container, so PODMAN_SOCK_PATH
      # (/var/run/podman.sock) would point at nothing there.
      PODMAN_HOST_SOCKET: ${PODMAN_HOST_SOCKET:-/run/user/501/podman/podman.sock}
      MATRIX_HOMESERVER: http://conduwuit:6167
      ADMIN_USER_ID: "@${ADMIN_USER:-admin}:local"
      # Conduwuit admin (for auto-creating Matrix users).
      # CONDUWUIT_ADMIN_ROOM defaults to the historic value but is now
      # overridable via .env — Continuwuity generates a fresh deterministic
      # admin room ID per database (e.g. after a volume reset), so the old
      # hard-coded value is wrong on freshly-bootstrapped stacks. Look up
      # the actual ID with: curl -H "Authorization: Bearer $MATRIX_ACCESS_TOKEN" \
      # http://localhost:${CONDUWUIT_PORT}/_matrix/client/v3/directory/room/%23admins%3Alocal
      CONDUWUIT_ADMIN_TOKEN: "${MATRIX_ACCESS_TOKEN}"
      CONDUWUIT_ADMIN_ROOM: "${CONDUWUIT_ADMIN_ROOM:-!cUxr0SyfINf9yEvBOD:local}"
      # Baseline git SSH identity for the ORCHESTRATOR's own git ops. Backed by
      # ORCHESTRATOR_SSH_KEY (see volumes above); a dud /dev/null key when unset,
      # in which case the per-environment deploy keys (which override this) are
      # the only working SSH path. The container carries no other keys, so an
      # unset baseline simply fails SSH auth for keyless envs (expected).
      # Agents never inherit this — startAgentProcess strips it per spawn.
      GIT_SSH_COMMAND: "ssh -i /root/.ssh/id_orchestrator -o StrictHostKeyChecking=accept-new"
      # LLM endpoint (LiteLLM proxy)
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN}"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "${ANTHROPIC_DEFAULT_SONNET_MODEL}"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: "${ANTHROPIC_DEFAULT_HAIKU_MODEL}"
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "${CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS:-1}"
      ACE_REPO_PATH: "${ACE_REPO_PATH:-}"
      ACE_WATCH_INTERVAL_SECONDS: "${ACE_WATCH_INTERVAL_SECONDS:-30}"
      ACE_BRIEFING_ENV_ID: "${ACE_BRIEFING_ENV_ID:-briefing-pack}"
      HOOK_PORT: "${HOOK_PORT:-4003}"
      # Bridges the `claude` CLI's Bearer-only auth (ANTHROPIC_AUTH_TOKEN) to a
      # plain Anthropic API key's x-api-key-only auth — see anthropic-proxy.js.
      # Internal-only, like the :4002 API; agent containers reach it as
      # `orchestrator:${ANTHROPIC_PROXY_PORT}` (already connected into every
      # per-agent network), so it needs no published host port.
      ANTHROPIC_PROXY_PORT: "${ANTHROPIC_PROXY_PORT:-4004}"
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-agent-studio}"
      # Instance identity for per-stack container eviction/reconcile scoping.
      # Lets multiple stacks share one Podman store without evicting each other's
      # agent containers. Defaults to COMPOSE_PROJECT_NAME when unset.
      AEE_INSTANCE_ID: "${AEE_INSTANCE_ID:-${COMPOSE_PROJECT_NAME:-agent-studio}}"
    depends_on:
      conduwuit:
        condition: service_started

  bp-explorer:
    build:
      context: ./bp-explorer
    container_name: ${COMPOSE_PROJECT_NAME}-bp-explorer
    restart: unless-stopped
    expose:
      - "8765"
    volumes:
      - agent-pool-workspace:/workspace
      - ~/.gitconfig:/root/.gitconfig:ro
    environment:
      AEE_ENABLED: "true"
      AEE_ORCHESTRATOR_URL: http://orchestrator:4002
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN}"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "${ANTHROPIC_DEFAULT_SONNET_MODEL}"
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "${CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS:-1}"
    depends_on:
      orchestrator:
        condition: service_started

  admin-console:
    build:
      context: ./admin-console
      args:
        # Resolved on the host by the Makefile (git isn't available inside
        # this build context) and defaulted so a bare `podman compose build`
        # still succeeds without git metadata.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-}
        # Base64 of the raw `<name>\t<email>` git-log lines for the About-page
        # contributors list (#1742); empty default keeps a bare compose build green.
        GIT_CONTRIBUTORS: ${GIT_CONTRIBUTORS:-}
        GIT_COMMIT_TIME: ${GIT_COMMIT_TIME:-}
    container_name: ${COMPOSE_PROJECT_NAME}-admin-console
    restart: unless-stopped
    # Required for podman socket access on SELinux-enforcing hosts (Fedora CoreOS).
    # Without this, the /api/logs/stream SSE endpoint silently returns
    # "[log error: connect EACCES /var/run/podman.sock]".
    security_opt:
      - label=disable
    ports:
      - "${ADMIN_PORT:-4000}:4000"
    volumes:
      - agent-pool-workspace:/workspace
      - skills-pool:/pool
      # Control-plane volume (#185) — same volume the orchestrator writes to;
      # the session-log SSE stream + status reads tail it from here.
      - agent-control-plane:/control
      # ACE / BriefingPack integration: uncomment when ACE_REPO_PATH is set in .env
      # - ${ACE_REPO_PATH}:/ace:rw
      # Rootless Podman socket — same default + override mechanism as the
      # orchestrator service above (see PODMAN_HOST_SOCKET in .env).
      - ${PODMAN_HOST_SOCKET:-/run/user/501/podman/podman.sock}:/var/run/podman.sock:ro
    environment:
      TZ: Europe/Berlin
      NODE_ENV: production
      PODMAN_SOCK_PATH: /var/run/podman.sock
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN}"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "${ANTHROPIC_DEFAULT_SONNET_MODEL}"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: "${ANTHROPIC_DEFAULT_HAIKU_MODEL}"
      MATRIX_HOMESERVER: http://conduwuit:6167
      MATRIX_ACCESS_TOKEN: "${MATRIX_ACCESS_TOKEN}"
      ADMIN_USER_ID: "@${ADMIN_USER:-admin}:local"
      ACE_REPO_PATH: "${ACE_REPO_PATH:-}"
      # Admin Console login (#276) — single credential pair gating the console.
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      AUTH_SESSION_SECRET: "${AUTH_SESSION_SECRET:-}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-}"
      STT_URL: "${STT_URL:-http://stt:9000}"
      # STT request timeout (ms). A Meeting Note-Taker segment (#1296) can be up
      # to 120 s of audio, which may take longer to transcribe on CPU than the
      # old 15 s hard cap; default 60 s (set in admin-console/api/transcribe.js).
      STT_TIMEOUT_MS: "${STT_TIMEOUT_MS:-}"
      # Max simultaneous orchestrator respawn calls fired by
      # POST /api/llm-endpoints/:id/respawn-agents (see .env.example).
      RESPAWN_CONCURRENCY: "${RESPAWN_CONCURRENCY:-}"
    depends_on:
      conduwuit:
        condition: service_started

  stt:
    build:
      context: ./stt
    container_name: ${COMPOSE_PROJECT_NAME}-stt
    restart: unless-stopped
    expose:
      - "9000"

volumes:
  conduwuit-db:
    name: ${COMPOSE_PROJECT_NAME}_conduwuit-db
  agent-pool-workspace:
    name: ${COMPOSE_PROJECT_NAME}_agent-pool-workspace
  # Central skill pool, shared between orchestrator (read-only at /template-workspace)
  # and admin-console (read-write at /pool).
  skills-pool:
    name: ${COMPOSE_PROJECT_NAME}_claude-workspace
  # Persisted Claude CLI home (~/.claude) — keeps `--resume <sessionId>`
  # working across orchestrator container restarts.
  claude-home:
    name: ${COMPOSE_PROJECT_NAME}_claude-home
  # Control-plane state pushed by agents (#185): /control/agents/<id>/status.json
  # and /control/agents/<id>/sessions/<roomId>.jsonl. Mounted by orchestrator +
  # admin-console only — the read-side that survives per-agent volume isolation.
  agent-control-plane:
    name: ${COMPOSE_PROJECT_NAME}_agent-control-plane
