journeyVersion: 1
id: triggers
title: Triggers
order: 30
# CI lane only: fake-claude, in-stack stack. The agent is bound to the in-stack
# git remote (so the single-member team materialises with zero external deps).
# The trigger repo picker only parses github.com URLs, so it lists no repo here —
# cron / once / http are configured AND saved, while github-event / data-flow are
# toured (form + catalog captured) without a repo and not saved. github-event
# firing end-to-end is covered by the iban-story journey.
lanes: [ci]
# Materialising the single-BA team (clone attempt + Matrix + container spawn) plus
# five sequential trigger saves runs past the default per-test budget on a cold
# stack.
timeoutMs: 180000

# Precondition: one Business-Analyst agent (triggers-demo-business-analyst) on a
# credential-less env whose repo URL is a github.com URL (so the trigger panel's
# repo picker lists it). Fixed ids keep screenshots deterministic (§7); the
# fixture pre-/post-cleans so re-runs on the same stack stay isolated.
fixtures:
  - fixture: triggerAgent
    params:
      teamId: triggers-demo
      envId: triggers-demo-env
      envName: Triggers Demo
      repoUrl: "http://git-remote/e2e/fixture.git"

steps:
  # ── Slide 16: chapter intro — what a trigger is (narrative-only) ─────────────
  - kind: narrative-only
    id: intro
    voiceover: |
      A trigger is the rule that says "when this happens, wake this agent and give it this prompt." It's what turns a group of chat agents into an autonomous, event-driven team. Let's look at the different types.
    narrative: |
      In the demo you just saw, something quietly did a lot of the heavy lifting. Remember how the Developer woke up the moment a human applied the ready label, and the Code Reviewer sprang to life the instant a pull request was opened? No one opened a chat and typed "please start now" — the agents reacted to events on their own. What made that possible are triggers.

      A trigger is the rule that says "when this happens, wake this agent and give it this prompt." It's the mechanism that turns a group of chat agents into an autonomous, event-driven team — the difference between an assistant you have to talk to and a workforce that responds to what's happening in your project by itself.

      So far we've only seen one kind of trigger in action: reacting to GitHub events like a labelled issue or a new pull request. But that's just one of several. In this chapter I want to go one level deeper and show you the different types of triggers the platform offers — reacting to GitHub events, running on a schedule, firing once at a set time, or being called from the outside via a webhook — and how each one is configured. Let's look at them one by one.

  # Open the trigger panel on the Business Analyst (plumbing — no capture).
  - action:
      do: triggers.openPanel
      agentId: triggers-demo-business-analyst

  # ── Slide 17: Cron (recurring) ──────────────────────────────────────────────
  - id: cron
    voiceover: |
      The most intuitive kind is a scheduled trigger. I pick Cron, choose Daily at 07:00 — the platform confirms it in plain language and shows the cron expression — and write the prompt the agent runs every morning, unattended.
    narrative: |
      Let's create our first trigger, and start with the most intuitive kind: a scheduled trigger. I open an agent — here the Business Analyst — and add a trigger to it directly. This panel is where every trigger is configured, and the fields are the same regardless of type.

      At the top I can give it an ID — optional, it's auto-generated if I leave it blank. Then the key choice: the Type. I've picked Cron (recurring) — a trigger that fires on a repeating schedule. The Studio keeps the scheduling human-friendly: I choose Daily, set the time to 07:00, and it confirms in plain language "Every day at 07:00" while quietly showing the underlying cron expression, 0 7 * * *, for anyone who wants it. So there's no need to remember cron syntax — you pick a cadence and a time, and the platform translates it.

      Below that is the heart of any trigger: the Prompt. This is the instruction the agent receives when the trigger fires — here, "Generate a summary of the pull requests completed yesterday." Every morning at seven, this agent will wake up on its own, with no one in the chat, and carry out that instruction. An optional Description documents its purpose, the Enabled toggle lets me arm or pause it without deleting it, and Add Trigger saves it.
    action:
      do: triggers.configureCron
      time: "07:00"
      prompt: Generate a summary of the pull requests completed yesterday.
    assert:
      do: triggers.expectCronForm
      summary: Every day at 07:00
      cron: "0 7 * * *"
    screenshot: trigger-cron

  - action:
      do: triggers.submit

  # ── Slide 18: Once (one-shot) ───────────────────────────────────────────────
  - id: once
    voiceover: |
      The simplest type is Once — a one-shot that fires a single time at a moment you pick, then removes itself. Here it delivers a personal reminder.
    narrative: |
      The second type is the simplest: a Once trigger — a one-shot that fires a single time, at a moment you pick, and then removes itself. Where Cron is for anything recurring, Once is for a single future action.

      The configuration is even shorter. I switch the Type to Once (one-shot), and the schedule collapses to a single field: Date & Time. Then, as with every trigger, the Prompt carries the instruction — in this case a small personal reminder: "Remind me once that I am responsible for the time reporting this week." On that date, at that time, the agent wakes up, delivers the reminder into the chat, and the trigger is done — it won't fire again.

      It's a modest feature, but a telling one: it shows triggers aren't only about heavy automation. A one-shot can be a personal nudge, a deferred follow-up, a "check back on this next Monday." Same mechanism as the scheduled digest, just scoped to a single occurrence.
    action:
      do: triggers.configureOnce
      at: "2027-07-20T08:00"
      prompt: Remind me once that I am responsible for the time reporting this week.
    assert:
      do: triggers.expectOnceForm
    screenshot: trigger-once

  - action:
      do: triggers.submit

  # ── Slide 19: HTTP webhook ──────────────────────────────────────────────────
  - id: http
    voiceover: |
      An HTTP webhook lets an external system fire the trigger. The panel generates a dedicated endpoint and a required secret — copy it once into your calling system; there's no open, unauthenticated mode.
    narrative: |
      The third type opens the team up to the outside world. Where Cron and Once fire on time, an HTTP webhook trigger fires when an external system calls it — a CI/CD pipeline, a monitoring tool, a deployment script, anything that can send an HTTP request.

      When I choose HTTP webhook as the type, the panel generates the two things a caller needs. First, a dedicated endpoint on the webhook port — a unique URL that belongs to this one trigger on this one agent. Second, and importantly, an X-Hook-Secret. This is a required shared secret: any external system that wants to fire the trigger must send this secret in the request header. That's the security model — there's no open, unauthenticated mode; you copy the secret once, store it wherever the calling system keeps its credentials, and you can rotate it here at any time with the refresh button.

      The Prompt again defines what the agent does when the call arrives — here, reacting to a completed deployment. So the moment a deployment finishes, the pipeline hits this endpoint, and the agent wakes up to react. This is how you wire agents into the tools you already run, so your existing automation can hand off to the team.
    action:
      do: triggers.configureHttp
      prompt: The CI/CD pipeline has just deployed a new version to production.
    assert:
      do: triggers.expectHttpForm
      agentId: triggers-demo-business-analyst
    screenshot: trigger-http

  - action:
      do: triggers.submit

  # ── Slide 20: GitHub event ──────────────────────────────────────────────────
  - id: github-event
    voiceover: |
      This is the type doing the real work in a flow. I pick the repository and one event from the full catalog — here Issue labeled — and narrow it to a single label, "ready", so the agent reacts to precisely the signal it cares about.
    narrative: |
      And now the one we've already seen doing the real work in the demo: the GitHub event trigger. This is the type that made the Developer wake on a ready label and the Code Reviewer wake on a new pull request. Here we get to see the full menu of what an agent can react to.

      After choosing GitHub event as the type, I first pick the Repository the agent should watch. Then comes the Event, and this is the heart of it: the complete catalog of things that can happen on a repo. A push; the whole pull-request lifecycle — opened, closed, merged, reopened, labeled, unlabeled, review submitted, review comment; issue comments; the issue lifecycle — opened, closed, labeled, unlabeled; and even release published. Each one is a precise hook into the team's GitHub workflow.

      Here I pick Issue labeled — exactly how the earlier hand-offs worked: the Business Analyst's issue getting the ready label was an issues.labeled event, and that's what set the Developer in motion. Typically you'd narrow it further with a label filter — react only to the ready label, not every label — so an agent responds to precisely the signal it cares about. This is the trigger type that turns GitHub itself into the team's nervous system: work moves, labels get applied, and the right agent wakes up for the right event, entirely on its own.
    action:
      do: triggers.configureGithubEvent
      event: issues.labeled
      labelFilter: ready
      prompt: A ready issue was labelled — pick it up and begin implementation.
    assert:
      do: triggers.expectGithubEventForm
    screenshot: trigger-github-event

  # Form tour only: the in-stack repo isn't a github.com URL, so there is no repo
  # to bind and save against — cancel without persisting.
  - action:
      do: triggers.cancelForm

  # ── Slide 21: Data flow — agent dependency ──────────────────────────────────
  - id: data-flow
    voiceover: |
      The subtlest type is a data-flow dependency. It reframes a push as a hand-off between teammates: an upstream agent committed its work, so now it's your turn. The woken agent pulls, checks relevance, and continues — or replies PASS.
    narrative: |
      The fifth type is subtle but important: Data flow — agent dependency. At first glance it looks like a plain push trigger, but conceptually it's something different.

      A raw push trigger is a purely technical signal: "a commit landed." A data-flow trigger reframes that same event as a hand-off between teammates: "an upstream agent finished a piece of work and committed it — that committed artifact is your input, so now it's your turn." Because every agent has its own workspace and its own clone of the repo, git is the durable bridge between them — so one agent pushing its result is the mechanism by which the next agent receives it.

      The variant shown here is the general one: this agent is woken on any push to the team repo, regardless of who pushed — even its own commits. That's why the discipline in the prompt matters: the woken agent should git pull, check whether the change is actually relevant, and simply reply [PASS] if there's nothing to do. But the real power is that in the Flow editor you can draw a data-flow connection from one specific producer to one specific consumer, matched on a named artifact — so the same mechanism scales from "react to any change" down to "listen precisely for the result of one named agent."
    action:
      do: triggers.configureDataFlow
      prompt: An upstream teammate pushed work — pull, check relevance, then continue or reply [PASS].
    assert:
      do: triggers.expectDataFlowForm
    screenshot: trigger-data-flow

  # Form tour only (same repo-picker reason as github-event) — cancel.
  - action:
      do: triggers.cancelForm

  # Persistence proof: the three saved triggers (cron, once, http) exist on the
  # agent (API-level). github-event / data-flow are toured, not saved (see header).
  - assert:
      do: triggers.expectTriggerCount
      agentId: triggers-demo-business-analyst
      count: 3
