# LoopScript Template
# A LoopScript defines the phases and gates that an agent
# goes through during a mission.

# Schema version — always use sase/loop-script/v1
schema: sase/loop-script/v1

# Unique ID — Format: LS-{name}-v{version}
id: "LS-{{NAME}}-v1"

# Human-readable name
name: "{{NAME}} Development SOP"

# Phases — processed sequentially.
# Each phase has Actions (what to do) and a Gate (when the phase is complete).
phases:
  - id: understand
    name: Understand
    description: "{{Description: What should be understood in this phase?}}"
    actions:
      - "{{Action 1: e.g. Read the BriefingPack}}"
      - "{{Action 2: e.g. Read the MentorScripts}}"
    gate:
      description: "{{Gate description: When is this phase complete?}}"
      check: "{{Check criterion: How is the gate verified?}}"
      # strict: true                 # Optional — set for high-rigor missions
      # gate-command: "npm test"     # Optional — shell command that must exit 0

  - id: plan
    name: Plan
    description: "{{Description of the planning phase}}"
    actions:
      - "{{Action 1}}"
      - "{{Action 2}}"
    gate:
      description: "{{Gate description}}"
      check: "{{Check criterion}}"

  # Add more phases as needed:
  # - id: threat-model     # For high-rigor
  # - id: formal-verify    # For high-rigor

  - id: implement
    name: Implement
    description: "{{Description of the implementation phase}}"
    actions:
      - "{{Action 1}}"
      - "{{Action 2}}"
    # on-uncertainty determines what happens when there is uncertainty
    on-uncertainty: create-crp
    gate:
      description: "{{Gate description}}"
      check: "{{Check criterion}}"
      # gate-command: "pytest"       # Optional — shell command that must exit 0

  - id: self-review
    name: Self-Review
    description: "{{Description of the review phase}}"
    actions:
      - "{{Action 1}}"
      - "{{Action 2}}"
    gate:
      description: "{{Gate description}}"
      check: "{{Check criterion}}"
      # gate-command: "ruff check ." # Optional — shell command that must exit 0

  - id: package
    name: Package
    description: "{{Description of the packaging phase}}"
    actions:
      - "{{Action 1: e.g. Create MRP}}"
    gate:
      description: "{{Gate description}}"
      check: "{{Check criterion}}"

# Escalation rules — when the agent must create a CRP
escalation:
  uncertainty-threshold:
    description: "confidence < {{THRESHOLD}}% → create CRP"
    action: create-crp
  scope-creep:
    description: "Changes outside the BriefingPack scope → create CRP"
    action: create-crp
  # structural-triggers — deterministic CRP triggers (see engineering skill for full taxonomy):
  # structural-triggers:
  #   - id: api-contract
  #     description: "Public API or schema change"
  #     action: create-crp
  #     mode: blocking
  #   - id: security
  #     description: "Auth, authz, or cryptography decision"
  #     action: create-crp
  #     mode: blocking

# N-Version Programming — parallel independent implementations
n-version:
  enabled: false    # true for high-rigor missions
  count: 2          # Number of parallel implementations
