# bp-explorer — read-only BriefingPack viewer (in-cluster only, no ingress).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bp-explorer
  namespace: agent-studio
  labels:
    app.kubernetes.io/name: agent-studio
    app.kubernetes.io/component: bp-explorer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-studio
      app.kubernetes.io/component: bp-explorer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-studio
        app.kubernetes.io/component: bp-explorer
    spec:
      containers:
        - name: bp-explorer
          image: agent-studio-bp-explorer:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: agent-studio-env
          env:
            - name: AEE_ENABLED
              value: "true"
            - name: AEE_ORCHESTRATOR_URL
              value: http://orchestrator:4002
          ports:
            - containerPort: 8765
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: agent-studio-workspace
---
apiVersion: v1
kind: Service
metadata:
  name: bp-explorer
  namespace: agent-studio
spec:
  selector:
    app.kubernetes.io/name: agent-studio
    app.kubernetes.io/component: bp-explorer
  ports:
    - name: http
      port: 8765
      targetPort: 8765
