# Agent Dashboard -- visual dashboard for Agents
#
# Usage (from repo root):
#   docker compose -f scripts/bp-explorer/docker-compose.yml up
#
# Or use the convenience script:
#   bash scripts/bp-explorer/start.sh

services:
  bp-explorer:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ../../:/repo
      - ~/.gitconfig:/root/.gitconfig:ro
    working_dir: /repo/scripts/bp-explorer
    environment:
      # Azure AI Foundry settings (passthrough from host or .env file)
      - CLAUDE_CODE_USE_FOUNDRY=${CLAUDE_CODE_USE_FOUNDRY:-}
      - ANTHROPIC_FOUNDRY_RESOURCE=${ANTHROPIC_FOUNDRY_RESOURCE:-}
      - ANTHROPIC_FOUNDRY_API_KEY=${ANTHROPIC_FOUNDRY_API_KEY:-}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      # Direct Anthropic API (alternative to Foundry)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
