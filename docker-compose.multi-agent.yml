# Multi-Agent Overlay — Process-per-Agent Architecture
#
# Usage:
#   podman compose -f docker-compose.yml -f docker-compose.multi-agent.yml up -d --build
#
# The orchestrator container manages agents as child processes (node child_process.spawn).
# Each agent runs agent-runner.js inside the orchestrator container — no separate
# container per agent, no Podman socket needed.
#
# Create/update/delete agents via chat commands in the Multi-Agent room:
#   !agent add     — guided wizard
#   !agent update  — change agent prompt
#   !agent delete  — remove agent
#   !agent list    — show all agents
#   !agent enable <id> / !agent disable <id>

services:
  orchestrator:
    build:
      context: ./multi-agent
      dockerfile: Dockerfile
    container_name: orchestrator
    restart: unless-stopped
    volumes:
      - agent-pool-workspace:/workspace
      - claude-workspace:/template-workspace:ro
      - ~/.ssh/id_accenturecodefoundry:/root/.ssh/id_accenturecodefoundry:ro
      - ~/.ssh/id_accenturecodefoundry.pub:/root/.ssh/id_accenturecodefoundry.pub:ro
    environment:
      TZ: Europe/Berlin
      MATRIX_HOMESERVER: http://conduwuit:6167
      MATRIX_ACCESS_TOKEN: "${ORCHESTRATOR_TOKEN}"
      MATRIX_BOT_USER_ID: "@orchestrator:local"
      MULTI_AGENT_ROOM: "${MULTI_AGENT_ROOM}"
      ADMIN_USER_ID: "@thorsten:local"
      # Conduwuit admin (for auto-creating Matrix users)
      CONDUWUIT_ADMIN_TOKEN: "${MATRIX_ACCESS_TOKEN}"
      CONDUWUIT_ADMIN_ROOM: "!cUxr0SyfINf9yEvBOD:local"
      # Git identity for agents that use git (push/PR)
      GIT_SSH_COMMAND: "ssh -i /root/.ssh/id_accenturecodefoundry -o StrictHostKeyChecking=accept-new"
      # Azure AI Foundry
      CLAUDE_CODE_USE_FOUNDRY: "1"
      ANTHROPIC_FOUNDRY_RESOURCE: "${ANTHROPIC_FOUNDRY_RESOURCE}"
      ANTHROPIC_FOUNDRY_API_KEY: "${ANTHROPIC_FOUNDRY_API_KEY}"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "${ANTHROPIC_DEFAULT_SONNET_MODEL}"
    depends_on:
      conduwuit:
        condition: service_started

volumes:
  agent-pool-workspace:
    name: vgh-claw_agent-pool-workspace
  claude-workspace:
    name: vgh-claw_claude-workspace
