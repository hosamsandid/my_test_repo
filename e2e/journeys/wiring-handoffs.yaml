journeyVersion: 1
id: wiring-handoffs
title: Hand-offs — labels, artifacts, declared open ends
order: 48
# CI lane only. Draft-only, no team/Matrix side effects. Covers S2 (label
# hand-off incl. the claim), S11 (file-artifact hand-off) and the open-end
# declaration of concept §4.7: an unconsumed produced artifact raises a
# call-to-action, and marking it terminal resolves it into a proper endpoint.
lanes: [ci]
timeoutMs: 120000

fixtures:
  - fixture: flowsDraft
    params:
      draftName: Hand-offs

steps:
  - kind: narrative-only
    id: intro
    narrative: |
      Agent-to-agent hand-offs ride on labels and artifacts. This journey
      wires a claimed label hand-off, a file-artifact hand-off, and then
      declares a deliberate open end — the difference between "forgotten"
      and "the end product".

  - action:
      do: flows.newDraft
  - action:
      do: flows.renameDraft
      name: Hand-offs
  - action:
      do: flows.addAgentFromScratch
      name: Analyst
      notes: Analyse the request and write an analysis report.
  - action:
      do: flows.addAgentFromScratch
      name: Builder
      notes: Implement the analysed work and open a pull request.

  # ── S2: label hand-off with the derived claim ──────────────────────────────
  - id: label-handoff
    narrative: |
      The Analyst sets `analysis-done`; the Builder waits on it. The engine
      stamps the claim automatically — when the Builder wakes, the label flips
      to `analysis-done:wip`, so a stalled run is visibly different from a
      wake that never arrived.
    action:
      do: flows.wireLabelHandoff
      from: Analyst
      to: Builder
      label: analysis-done
    screenshot: wiring-handoff-label
  - assert:
      do: flows.expectDraftTrigger
      role: Builder
      event: issues.labeled
      labelFilter: analysis-done
      claimed: true
  - id: claim-readout
    narrative: |
      The persisted listener claims its wake label — when the Builder wakes,
      `analysis-done` flips to `analysis-done:wip` on the issue (asserted on
      the draft document above; the gate variant of the claim chip is asserted
      in the review-gate journey).
    screenshot: wiring-handoff-claim

  # ── S11: file-artifact hand-off ────────────────────────────────────────────
  - id: artifact
    narrative: |
      Files hand off by logical name, not path: the Builder consumes the
      Analyst's "Analysis report", resolved at runtime from the artifact
      manifest.
    action:
      do: flows.addArtifactInput
      name: Builder
      from: Analyst
      artifact: Analysis report
    screenshot: wiring-handoff-artifact

  # ── §4.7: the open-end declaration ─────────────────────────────────────────
  - action:
      do: flows.openRouting
      name: Builder
  - action:
      do: flows.addOutcome
      name: Builder
      title: Opens PR
      when: Implementation is complete and tests are green
      action: openPr
  - action:
      do: flows.saveOutcomes
      name: Builder
  - action:
      do: flows.closeInspector
      name: Builder
  - id: open-end-cta
    narrative: |
      The Builder's pull request has no consumer in this flow — the editor
      flags it, not as a dead error but as an open question with three
      answers: wire a consumer, mark it terminal, or mark it external.
    assert:
      do: flows.expectLint
      code: producer-unconsumed
    screenshot: wiring-open-end-cta
  - id: mark-terminal
    narrative: |
      Here the merged PR IS the product, so we declare it terminal. The row
      now reads "⏹ Terminal by design — the end product", and the wiring
      hint disappears: an intentional open end is not a smell.
    action:
      do: flows.markOutcomeTerminal
      name: Builder
    screenshot: wiring-open-end-terminal
  - assert:
      do: flows.expectLint
      code: producer-unconsumed
      absent: true
