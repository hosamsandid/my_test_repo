schema: sase/loop-script/v1
id: LS-high-rigor-v1
name: High-Rigor Development SOP

phases:
  - id: understand
    name: Understand
    description: Read BriefingPack and MentorScripts, fully understand the task
    actions:
      - Read the BriefingPack completely and carefully
      - Read all referenced MentorScripts
      - Identify all Acceptance Criteria
      - Clarify the context (files, modules, APIs)
      - Identify security-relevant aspects
    gate:
      description: Full understanding of the mission demonstrated
      check: "Agent can correctly paraphrase Goal, AC, Constraints AND security implications"
      strict: true

  - id: plan
    name: Plan
    description: Create a detailed implementation plan
    actions:
      - Create a detailed, step-by-step implementation plan
      - Map each step to at least one AC
      - Identify all risks and gotchas
      - Plan rollback strategies for critical steps
      - Verify MentorScript compliance of the plan
    gate:
      description: Plan covers all AC and includes risk mitigations
      check: "Each AC mapped, risks identified, rollback strategies defined"
      strict: true

  - id: threat-model
    name: Threat Model
    description: Analyze and document security implications
    actions:
      - Analyze attack vectors of the planned changes
      - Assess impact on existing security boundaries
      - Check input validation and output encoding
      - Document trust boundaries and data flows
      - Identify required security tests
    gate:
      description: Security implications fully documented
      check: "Threat model documented, all attack vectors assessed, mitigations defined"
      strict: true

  - id: implement
    name: Implement
    description: Implement the plan step by step with increased diligence
    actions:
      - Implement step by step according to the plan
      - Strictly follow the MentorScript rules
      - Test each step immediately after completion
      - Implement security mitigations from the threat model
      - Document every deviation from the plan
    on-uncertainty: create-crp
    gate:
      description: All plan steps and security mitigations implemented and machine-verified
      check: "Implementation complete, compiled, tested, structured outputs validated, security mitigations active"
      gate-command: |
        Mandatory build verification — execution is non-negotiable. Uncompiled code, failing tests,
        and unvalidated build files are NEVER acceptable. You MUST execute every applicable step below.

        1. COMPILE / BUILD — detect the build system and run compilation:
           - pom.xml → mvn compile (multi-module: run from project root)
           - build.gradle / build.gradle.kts → gradle build or gradle compileJava compileTestJava
           - package.json → npm run build (or yarn build / pnpm build if lockfile indicates)
           - pyproject.toml / setup.py → pip install -e . or python -m build
           - Makefile → make
           - go.mod → go build ./...
           - Cargo.toml → cargo build
           - tsconfig.json (no bundler) → tsc
           - If none of these exist, check if individual source files can be compiled directly
             (javac, gcc/g++, rustc, etc.)

        2. TEST — run the full test suite:
           - pom.xml → mvn test
           - build.gradle → gradle test
           - package.json → npm test
           - pyproject.toml → pytest
           - Makefile → make test (if target exists)
           - go.mod → go test ./...
           - Cargo.toml → cargo test
           - If no test suite exists, document this explicitly in the MRP under Sound Verification.
             The absence of tests does not excuse skipping the build step.

        3. VALIDATE STRUCTURED FILES — if your changes produce or modify structured files, validate them:
           - JSON → python3 -c "import json, pathlib; json.loads(pathlib.Path('FILE').read_text())"
           - YAML → python3 -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('FILE').read_text())"
           - XML (incl. pom.xml) → python3 -c "import xml.etree.ElementTree as ET; ET.parse('FILE')"
           - TOML → python3 -c "import tomllib, pathlib; tomllib.loads(pathlib.Path('FILE').read_text())"
           - SQL → syntax-check with the available database client if accessible
           - Dockerfile → hadolint or docker build --check if available
           - Terraform (.tf) → terraform validate

        4. BUILD INTEGRITY — if you modified build configuration (pom.xml, build.gradle, package.json,
           Dockerfile, Makefile, Cargo.toml, etc.), run a clean build from scratch to verify the
           build pipeline still works end-to-end. Do not rely on incremental builds for this check.

        Every step that applies to the project MUST be executed. All commands must exit 0.
        If a command fails, fix the root cause and re-run — do not proceed until all applicable
        verification passes. Document every executed command and its result for the MRP.
      strict: true

  - id: artifact-verify
    name: Artifact Verification
    description: Execute all verify-commands declared on output artifacts in the BriefingPack
    actions:
      - Collect all output artifacts from the BriefingPack that have a verify-command field
      - If no output artifacts declare verify-commands, document this and pass the gate
      - Execute each verify-command via Bash from the project root directory
      - If any command exits non-zero, fix the artifact and re-run (max 3 attempts per command)
      - Document each result in a table for the MRP (artifact path, command, exit code)
    gate:
      description: All machine-verifiable output artifacts pass their declared verify-command
      check: "Every output artifact with a verify-command exited 0, or no verify-commands declared. Results documented for MRP."
      strict: true

  - id: formal-verify
    name: Formal Verify
    description: Verify formal properties
    actions:
      - Verify invariants and pre-/postconditions
      - Check type safety and null safety
      - Verify concurrency properties (if relevant)
      - Check resource management (leaks, handles)
      - Document verified formal properties
    gate:
      description: Formal properties verified and documented
      check: "All relevant formal properties checked and documented"
      gate-command: |
        Mandatory type checking and formal verification. Run every applicable tool below.

        TYPE CHECK:
        - TypeScript → tsc --noEmit
        - Python → mypy . or pyright (if configured in pyproject.toml)
        - Java → compilation already covers type safety (verified in implement gate)
        - Go → go vet ./... (if not already run)
        - Rust → cargo check (if not already run via cargo build)

        STATIC ANALYSIS (beyond linting):
        - Java → mvn spotbugs:check or mvn pmd:check (if plugin configured)
        - Python → bandit -r . (security-focused static analysis)
        - C/C++ → cppcheck or scan-build (if available)

        All commands must exit 0. If no type checker or static analysis tool is configured,
        document this in the MRP under Sound Verification and explain what manual verification
        was performed instead.
      strict: true

  - id: self-review
    name: Self-Review
    description: Comprehensive self-review
    actions:
      - Check code against all Acceptance Criteria
      - Check full MentorScript compliance
      - Check security aspects against threat model
      - Check formal properties against specification
      - Check for code quality, consistency, and maintainability
      - Ask yourself — Would I approve this PR in a safety-critical system?
    gate:
      description: Comprehensive self-review passed
      check: "All AC met, MentorScript-compliant, security verified, PR-ready"
      gate-command: |
        Mandatory linting and security audit. Run every applicable tool below. All must exit 0.

        LINT — detect and run the project linter:
        - Python → ruff check . or flake8 (check pyproject.toml / setup.cfg for config)
        - JavaScript/TypeScript → npx eslint . (check .eslintrc / eslint.config.*)
        - Java → mvn checkstyle:check (if plugin configured in pom.xml)
        - Go → golangci-lint run (if .golangci.yml exists) or go vet ./...
        - Rust → cargo clippy
        - Ruby → rubocop

        SECURITY AUDIT — run dependency vulnerability scanning:
        - npm/yarn → npm audit --audit-level=high
        - Python → pip-audit or safety check
        - Java (Maven) → mvn org.owasp:dependency-check-maven:check (if plugin available)
        - Go → govulncheck ./... (if available)
        - Rust → cargo audit (if installed)
        - Container images → trivy image (if applicable)

        If no linter or security tool is configured, document this in the MRP under SE Hygiene.
      strict: true

  - id: package
    name: Package
    description: Create Mission Result Package
    actions:
      - Create MRP with all 5 criteria
      - Include threat model summary
      - Include formal verification results
      - Link all CRPs and VCRs
      - Document git diff --stat and commit history
    gate:
      description: MRP complete with security and verification evidence
      check: "All 5 MRP criteria plus security and formal verification evidence"
      strict: true

escalation:
  structural-triggers:
    - id: api-contract
      description: "Changes affect API contract, database schema, or public interface"
      action: create-crp
      mode: blocking
    - id: security
      description: "Involves authentication, authorization, or cryptography"
      action: create-crp
      mode: blocking
    - id: scope-deviation
      description: "Contradicts or goes beyond the BriefingPack scope"
      action: create-crp
      mode: blocking
    - id: multi-approach
      description: "Multiple valid approaches with different tradeoffs and no BP guidance"
      action: create-crp
      mode: deferred
    - id: cross-scope-reversal
      description: "Reversing requires touching files beyond current scope"
      action: create-crp
      mode: blocking
    - id: data-destructive
      description: "Changes that could cause data loss, silent corruption, or irreversible state changes"
      action: create-crp
      mode: blocking
    - id: dependency-change
      description: "Adding, removing, or upgrading (major version) any external dependency"
      action: create-crp
      mode: deferred
    - id: observable-behavior-change
      description: "Modifying user-visible output, error messages, log formats, or response structure not explicitly specified by the BP"
      action: create-crp
      mode: deferred
  scope-creep:
    description: "Changes to files outside the BriefingPack scope"
    action: create-crp

n-version:
  enabled: true
  count: 3
