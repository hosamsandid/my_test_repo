# Admin Console — web UI on :4000 (reach it via kubectl port-forward locally).
# Known POC gap: the compose service mounts the Podman socket for the raw
# container-log SSE stream (/api/logs/stream); there is no socket on k8s, so
# that one endpoint is degraded. Agent chat/session logs are unaffected (they
# read the /workspace + /control volumes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-console
  namespace: agent-studio
  labels:
    app.kubernetes.io/name: agent-studio
    app.kubernetes.io/component: admin-console
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-studio
      app.kubernetes.io/component: admin-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-studio
        app.kubernetes.io/component: admin-console
    spec:
      containers:
        - name: admin-console
          image: agent-studio-admin-console:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: agent-studio-env
          env:
            - name: TZ
              value: Europe/Berlin
            - name: NODE_ENV
              value: production
            - name: MATRIX_HOMESERVER
              value: http://conduwuit:6167
            - name: ORCHESTRATOR_URL
              value: http://orchestrator:4002
            # The console gates runtime-dependent features (host-folder context
            # mounts, isLocalContextMountEnv) on the same runtime signal as the
            # orchestrator. Without this the console believed it ran on podman
            # and OFFERED context mounts that the orchestrator then silently
            # dropped at spawn (#1319). On k8s the feature needs the explicit
            # AEE_K8S_CONTEXT_HOSTPATH=1 opt-in via the agent-studio-env Secret.
            - name: AEE_CONTAINER_RUNTIME
              value: kubernetes
            # The console needs the SAME toolchain image prefix as the
            # orchestrator (#1941 AC11), not because it spawns anything, but
            # because it is the side that RESOLVES a seeded manifest into the
            # image reference an operator sees and installs
            # (`toolchainImagePrefix()` in api.js → the byte-identical
            # `admin-console/api/toolchain-registry.js`). Set on one side only,
            # the console would show and store a bare tag while the
            # orchestrator resolved a registry path — the install review would
            # then describe an image the cluster never pulls.
            #
            # Empty here for the same reason as on the orchestrator: base is the
            # kind/local flavour with side-loaded images. The hosted overlays
            # patch it (overlays/{test,preprod}/app/patch-toolchain-prefix.yaml).
            - name: AEE_TOOLCHAIN_IMAGE_PREFIX
              value: ""
            # The release tag those variant images carry. Same story as the
            # prefix: the manifest's `:latest` is the tag a developer's local
            # build produces, while a release pushes an IMMUTABLE tag and pins
            # it here via deploy/k8s/set-images.sh — so a cluster never pulls a
            # mutable `:latest` off a real registry. Empty here (kind side-loads
            # the bare tag) and rewritten by set-images.sh in the hosted overlays.
            - name: AEE_TOOLCHAIN_IMAGE_TAG
              value: ""
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet:
              # NOT /api/health — every /api/* route sits behind the #276 auth
              # gate and returns 401 to an unauthenticated probe. The static
              # SPA (login screen) is deliberately public.
              path: /
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: skills
              mountPath: /pool
            - name: control
              mountPath: /control
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: agent-studio-workspace
        - name: skills
          persistentVolumeClaim:
            claimName: agent-studio-skills
        - name: control
          persistentVolumeClaim:
            claimName: agent-studio-control
---
apiVersion: v1
kind: Service
metadata:
  name: admin-console
  namespace: agent-studio
  annotations:
    # Container-native load balancing: GKE creates a zonal NEG so the GCP LB
    # sends traffic directly to pods, bypassing kube-proxy.
    cloud.google.com/neg: '{"ingress": true}'
    # BackendConfig wires IAP onto the GCP backend service created by the Ingress.
    beta.cloud.google.com/backend-config: '{"default": "admin-console-backend"}'
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: agent-studio
    app.kubernetes.io/component: admin-console
  ports:
    - name: http
      port: 4000
      targetPort: 4000
