# Multi-Agent Overlay — Container-per-Agent Architecture
#
# Usage:
#   podman compose -f docker-compose.yml -f docker-compose.multi-agent.yml up -d --build
#
# The orchestrator container manages agent containers dynamically via the Podman
# REST API (socket mounted below). Each agent runs in its own container using
# the e-vgh-claw-agent-runner:latest image.
#
# IMPORTANT: Build the runner image before starting the stack:
#   podman build -f multi-agent/Dockerfile.runner -t e-vgh-claw-agent-runner:latest ./multi-agent
#
# Create/update/delete agents via chat commands in the Multi-Agent room:
#   !agent add     — guided wizard
#   !agent update  — change agent prompt
#   !agent delete  — remove agent
#   !agent list    — show all agents
#   !agent enable <id> / !agent disable <id>

services:
  orchestrator:
    build:
      context: ./multi-agent
      dockerfile: Dockerfile
    container_name: orchestrator
    restart: unless-stopped
    volumes:
      - agent-pool-workspace:/workspace
      - claude-workspace:/template-workspace:ro
      - ~/.ssh/id_accenturecodefoundry:/root/.ssh/id_accenturecodefoundry:ro
      - ~/.ssh/id_accenturecodefoundry.pub:/root/.ssh/id_accenturecodefoundry.pub:ro
      # Podman socket — allows orchestrator to create/start/stop agent containers.
      # Path is the rootless Podman socket. Override PODMAN_SOCK_PATH env var if
      # your Podman socket lives elsewhere (e.g. /run/user/502/podman/podman.sock
      # on macOS with Podman Desktop, or /run/podman/podman.sock for rootful).
      # The host-side path must be the actual socket — edit the left side below
      # if needed and set PODMAN_SOCK_PATH to match inside the container.
      - /run/user/1000/podman/podman.sock:/var/run/podman.sock
    environment:
      TZ: Europe/Berlin
      MATRIX_HOMESERVER: http://conduwuit:6167
      MATRIX_ACCESS_TOKEN: "${ORCHESTRATOR_TOKEN}"
      MATRIX_BOT_USER_ID: "@orchestrator:local"
      MULTI_AGENT_ROOM: "${MULTI_AGENT_ROOM}"
      ADMIN_USER_ID: "@thorsten:local"
      # Conduwuit admin (for auto-creating Matrix users)
      CONDUWUIT_ADMIN_TOKEN: "${MATRIX_ACCESS_TOKEN}"
      CONDUWUIT_ADMIN_ROOM: "!cUxr0SyfINf9yEvBOD:local"
      # Git identity for agents that use git (push/PR)
      GIT_SSH_COMMAND: "ssh -i /root/.ssh/id_accenturecodefoundry -o StrictHostKeyChecking=accept-new"
      # Azure AI Foundry
      CLAUDE_CODE_USE_FOUNDRY: "1"
      ANTHROPIC_FOUNDRY_RESOURCE: "${ANTHROPIC_FOUNDRY_RESOURCE}"
      ANTHROPIC_FOUNDRY_API_KEY: "${ANTHROPIC_FOUNDRY_API_KEY}"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "${ANTHROPIC_DEFAULT_SONNET_MODEL}"
      # Podman socket path inside the container (change if you remapped above)
      PODMAN_SOCK_PATH: "/var/run/podman.sock"
      # Runner image name (built separately — see top of this file)
      AGENT_RUNNER_IMAGE: "e-vgh-claw-agent-runner:latest"
      # Compose network name — agent containers must reach conduwuit
      AGENT_NETWORK: "e-vgh-claw_default"
    depends_on:
      conduwuit:
        condition: service_started

volumes:
  agent-pool-workspace:
    name: vgh-claw_agent-pool-workspace
  claude-workspace:
    name: vgh-claw_claude-workspace
