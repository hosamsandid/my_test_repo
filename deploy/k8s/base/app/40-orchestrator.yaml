# Orchestrator — control plane. Runs with AEE_CONTAINER_RUNTIME=kubernetes so
# agent containers become agent Pods (orchestrator/spawn-kubernetes-pod.js)
# created via its ServiceAccount; no container socket anywhere.
#
# Secrets (ANTHROPIC_*, MATRIX_ACCESS_TOKEN, CONDUWUIT_ADMIN_ROOM, ADMIN_USER_ID,
# …) come from the `agent-studio-env` Secret that kind-up.sh generates from .env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: agent-studio
  labels:
    app.kubernetes.io/name: agent-studio
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 1
  strategy:
    type: Recreate # in-memory agent-process map — never two orchestrators
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-studio
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-studio
        app.kubernetes.io/component: orchestrator
    spec:
      serviceAccountName: agent-studio-orchestrator
      containers:
        - name: orchestrator
          image: agent-studio-orchestrator:latest
          imagePullPolicy: Never # loaded into the kind node by kind-up.sh
          envFrom:
            - secretRef:
                name: agent-studio-env
          env:
            - name: TZ
              value: Europe/Berlin
            # --- container-runtime seam ---
            - name: AEE_CONTAINER_RUNTIME
              value: kubernetes
            - name: AEE_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENT_IMAGE
              value: as-agent:latest
            # Where a TOOLCHAIN variant's image lives in this deployment
            # (#1941 AC11). A toolchain manifest declares the bare `repo:tag`
            # its build produces (`as-agent-jvm:latest`) and deliberately does
            # NOT name a registry — the checked-in manifest has to serve every
            # installation, and it cannot know where a given one pushed its
            # images. The deployment supplies that path as a PREFIX, which
            # `toolchain-registry.js:resolveToolchainImage` joins onto the bare
            # tag (an image that already carries a host or a digest is left
            # alone).
            #
            # EMPTY here on purpose: base is the kind/local flavour, where the
            # variant image is side-loaded into the node under exactly the bare
            # tag the manifest names, so prefixing it would point the pod at a
            # registry that has never been pushed to. The hosted overlays set
            # the Artifact Registry path instead
            # (overlays/{test,preprod}/app/patch-agent-image.yaml). Declared
            # rather than omitted so the value is visible in a rendered
            # manifest and render-check.sh can assert the local flavour
            # positively.
            - name: AEE_TOOLCHAIN_IMAGE_PREFIX
              value: ""
            # The release tag those variant images carry. Same story as the
            # prefix: the manifest's `:latest` is the tag a developer's local
            # build produces, while a release pushes an IMMUTABLE tag and pins
            # it here via deploy/k8s/set-images.sh — so a cluster never pulls a
            # mutable `:latest` off a real registry. Empty here (kind side-loads
            # the bare tag) and rewritten by set-images.sh in the hosted overlays.
            - name: AEE_TOOLCHAIN_IMAGE_TAG
              value: ""
            # kind: side-loaded images, never pullable. gke-up.sh rewrites this
            # to Always (mutable :latest tags on a real registry go stale on
            # nodes otherwise).
            - name: AEE_AGENT_IMAGE_PULL_POLICY
              value: IfNotPresent
            - name: AEE_WORKSPACE_PVC
              value: agent-studio-workspace
            - name: AEE_AGENT_SERVICE_ACCOUNT
              value: agent-studio-agent
            - name: AEE_INSTANCE_ID
              value: agent-studio
            # --- stack wiring (cluster-DNS service names) ---
            - name: MATRIX_HOMESERVER
              value: http://conduwuit:6167
            - name: CONDUWUIT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-studio-env
                  key: MATRIX_ACCESS_TOKEN
                  optional: true # empty until the bootstrap has run
            - name: HOOK_PORT
              value: "4003"
          ports:
            - containerPort: 4002 # internal API (admin-console)
            - containerPort: 4003 # webhook server (http triggers)
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            # Claude CLI home (session snapshots for --resume). Lives on the
            # workspace PVC under claude-home/ — the same layout the k8s
            # spawner slices per-agent (claude-home/homes/<id>).
            - name: workspace
              mountPath: /root/.claude
              subPath: claude-home
            - name: skills
              mountPath: /template-workspace
              readOnly: true
            - name: control
              mountPath: /control
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: agent-studio-workspace
        - name: skills
          persistentVolumeClaim:
            claimName: agent-studio-skills
        - name: control
          persistentVolumeClaim:
            claimName: agent-studio-control
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator # DNS name must stay `orchestrator` — admin-console + agents default to http://orchestrator:4002
  namespace: agent-studio
spec:
  selector:
    app.kubernetes.io/name: agent-studio
    app.kubernetes.io/component: orchestrator
  ports:
    - name: internal-api
      port: 4002
      targetPort: 4002
    - name: hooks
      port: 4003
      targetPort: 4003
