journeyVersion: 1
id: team-setup
title: Team Setup
order: 10
# CI lane only for now: fake-claude, in-stack git remote, no external GitHub.
lanes: [ci]

# Precondition: a credential-less Working Environment pointing at the in-stack
# git remote, so the wizard materialises a team with zero external deps (#667).
# Fixed ids keep screenshots deterministic (§7); the fixture pre-/post-cleans so
# re-runs on the same stack stay isolated.
fixtures:
  - fixture: teamEnv
    params:
      teamId: agentic-demos
      envId: agentic-demos-env
      envName: Agentic Demos
      repoUrl: "http://git-remote/e2e/fixture.git"
      branch: main

steps:
  # ── Slide 1: chapter intro + "what is a team" (narrative-only) ──────────────
  # `voiceover:` is the compact narration for the walkthrough video (epic #741) —
  # the storyline, distinct from the fuller `narrative` above that feeds the deck.
  - kind: narrative-only
    id: intro
    voiceover: |
      Let's set up a team of agents that work together on one repository. Everything now starts at one front door — the "+ Create" launcher — and from there we pick the ready-made-team path, which runs the five-step wizard, ending in a review before anything is created.
    narrative: |
      Let's walk through how you go from an idea to a running set of agents. This is where the Agent Studio really shows what it's about: it doesn't just run a single agent, it lets you stand up a whole team of agents that work together on the same repository — and it lets you start small and grow into that team when you're ready.

      So what exactly is a team here? A team is a coordinated group of AI agents — think of a Business Analyst, a Developer, a Code Reviewer — each with its own role, its own system prompt. They all share one working environment, which means they all work against the same GitHub repository with the same credentials and the same knowledge sources. What makes it a team rather than just a collection of agents is that they're wired together: one agent's output becomes the next agent's trigger. The Business Analyst writes an issue, a human approves it, the Developer picks it up, opens a pull request, the Code Reviewer reacts to that pull request, and so on. The hand-offs happen automatically over GitHub labels and events.

      The important thing is that you no longer decide up front what kind of thing you're creating. There is now one front door — the "+ Create" launcher — and it asks a much simpler question: how would you like to start? Whether the result is one assistant or a four-agent team is an outcome the system right-sizes, not a mode you classify yourself. Let's start at that launcher, then follow the most complete path — starting from a ready-made team — all the way to a live, wired team.

  # ── Slide 2: the "+ Create" launcher (the new single front door) ─────────────
  - id: create-launcher
    voiceover: |
      Everything starts at the "+ Create" launcher, reachable from the sidebar on every page. It asks "what do you want to create?" and ranks the answers from simplest to most advanced. At the top, on its own, is the fastest thing you can do: chat with one assistant. Below it, under one heading, are three ways to build a team of agents that work together — a flow. And the expert path sits folded away under "Advanced options". Each option tells you where it lands you, and can show you a sketch of that screen before you commit. For the demo we take "Start from a ready-made team".
    narrative: |
      Everything starts at the launcher. It's reachable two ways that open the same screen: a persistent "+ Create" control pinned in the sidebar on every page, and a dedicated /create route. The heading asks one plain question — what do you want to create? — and, crucially, it answers "where should I begin?" as well, by ranking the options from simplest to most advanced instead of laying them out as equals.

      At the top, full width and on its own, is the hero: "Chat with one assistant", badged "Fastest start". It's the fast lane to a single assistant you can talk to in a minute — and the copy says out loud that you can grow it into a team whenever you're ready, so starting small is never a dead end.

      Under it, gathered into one bordered group with a heading that finally names the concept — "Or build a team of agents that work together (a flow)" — sit the three ways of doing exactly that: "Start from a ready-made team", badged Recommended, which opens the guided wizard on its template gallery; "Describe what you need", which lets the Flow Copilot draft a flow from a sentence; and "Design it on the canvas", marked Advanced, which drops you into the editor to wire it yourself. The group's intro makes the point that matters: all three end in the same flow, they just differ in how you start it.

      Last, collapsed, is "Advanced options", holding the one entry that names the artifact on purpose — "Configure an agent manually", the direct form where you set the id, role, environment and system prompt yourself. It's still one click away; it just isn't competing for a newcomer's attention any more.

      Two smaller touches do a lot of work here. Every option carries an outcome line — "opens a chat with your assistant", "review the team, then launch it", "opens an editable draft on the canvas" — so you know whether you're heading for a chat, a wizard or an editor. And hovering an option (or tabbing to it, or tapping its eye control on a touch screen) reveals a small hand-drawn sketch of that destination with a one-line caption. They're deliberately schematic rather than screenshots, so they promise the *kind* of screen and can never drift out of date.

      For this demo we take the most complete path — "Start from a ready-made team" — which runs the five-step wizard.
    # Open the launcher first (the intro above is narrative-only and never runs, so
    # nothing has navigated yet); create.open goes to /create and confirms the hero,
    # the three grouped flow cards and the still-collapsed Advanced disclosure, then
    # expectEntry spot-checks the ready-made-team card we'll take.
    action:
      do: create.open
    assert:
      do: create.expectEntry
      entry: template
    screenshot: create-launcher

  # Take the ready-made-team path into the wizard (plumbing — no capture).
  - action:
      do: create.startFromTemplate

  # ── Slide 3: Process step ───────────────────────────────────────────────────
  - id: process-step
    voiceover: |
      The wizard lands on the Process step — the template gallery. It comes first on purpose, because it's the central decision. For the demo we pick a ready-made template, the Core SDLC flow. It gives us four agents that cover a full build-and-review loop: a Business Analyst who writes issues, a Developer who implements them, a Code Reviewer, and a Reworker. The live preview on the right confirms the hand-offs connect.
    narrative: |
      Choosing "Start from a ready-made team" on the launcher drops us into the wizard, which lands directly on the Process step — the template gallery. It comes first on purpose, because the process is the central decision. Everything after it — the environment, the name, the knowledge — just qualifies this choice.

      The gallery lists the curated templates alongside any drafts you've saved. The two more free-form ways of authoring a process — describing it in plain language, or starting from a blank canvas — aren't crammed into this step anymore; they're their own options back on the "+ Create" launcher, grouped with this one under the flow heading, and the wizard keeps only a small "need a custom flow? use + Create" pointer. In this demo we take the simplest, most powerful path: we pick a ready-made template — the Core SDLC flow.

      Core SDLC gives us four agents that cover a complete build-and-review loop: the Business Analyst turns ideas into well-defined GitHub issues, the Developer implements a ready issue and opens a pull request, the Code Reviewer checks the change against every acceptance criterion, and the Reworker addresses review feedback and loops until the change is clean. The agents do the heavy lifting, but the human stays in control of the two decisions that matter — what gets built, by approving the issue, and the final merge. Below the selection you also see a small live preview of the flow and a wiring check, so you can confirm the hand-offs actually connect before moving on.
    action:
      do: wizard.selectProcessTemplate
      templateName: Core SDLC
    assert:
      do: wizard.expectFlowPreview
      edgeLabel: ready-for-implementation
      legendEntry: human approval
    screenshot: process-step-core-sdlc

  - action:
      do: wizard.next

  # ── Slide 4: Working Environment step ───────────────────────────────────────
  - id: working-environment
    voiceover: |
      Next, the working environment — where the team operates. It bundles the repository, the branch, and the credentials into one reusable template, so we just pick one from the grid.
    narrative: |
      The second step is the Working Environment. If the process defines what the team does, the environment defines where it does it.

      A Working Environment is a reusable infrastructure template. It bundles the GitHub repository the team works on, the branch, the SSH deploy key and the GitHub token used for git operations and API access, plus any knowledge sources. The key point is that we don't reassemble all of that here from raw credentials — the environment already packages it. So on this step we simply pick one from a card grid, if a suitable one already exists.

      This separation is deliberate: the same environment can be reused across many teams, and credentials live in their own store, so you can rotate a token without touching every team. Picking one is entirely optional, though — there's no separate place to create a working environment up front any more; leave this step empty and the team gets a fresh one of its own the moment it's created. For the demo we just select the one that points at our target repository and move on.
    assert:
      do: wizard.expectEnvironmentStep
      envName: Agentic Demos
    screenshot: working-environment-step

  # Selecting the env card auto-advances to the Team step (product behaviour).
  - action:
      do: wizard.selectEnvironment
      envName: Agentic Demos

  # ── Slide 5: Team identity step ─────────────────────────────────────────────
  - id: team-step
    voiceover: |
      Step three gives the team its identity: a name and an ID, both pre-filled from the environment. The ID becomes the prefix for every agent the team creates, like agentic-demos-developer.
    narrative: |
      Step three is where we give the team its identity — really just two fields: a team name and a team ID.

      The wizard is helpful here: both fields are pre-filled and suggested from the working environment we just picked, and the ID is a slug — lowercase, dashes only — that gets derived automatically from the name as we type. You can override either one, but you usually don't have to.

      Why does the ID matter? Because it becomes the prefix for every resource the team creates. So a team with the ID "agentic-demos" will produce agents like agentic-demos-developer, agentic-demos-code-reviewer, and so on. The wizard also checks the ID against everything that already exists — if it collides with an existing agent or team, it tells you right away and asks for a different one. That naming scheme is what keeps a multi-team setup clean and predictable.
    action:
      do: wizard.setTeamIdentity
      teamName: Agentic Demos
      teamId: agentic-demos
    assert:
      do: wizard.expectTeamIdentity
      teamName: Agentic Demos
      teamId: agentic-demos
    screenshot: team-step

  - action:
      do: wizard.next

  # ── Slide 6: Knowledge step (optional) ──────────────────────────────────────
  - id: knowledge-step
    voiceover: |
      Knowledge is optional. Here we choose the skills every member inherits, the sources it can query at runtime, and how learnings are shared across the team. We accept the defaults.
    narrative: |
      The fourth step is Knowledge — and it's explicitly optional. This is where we decide what the team knows and how it learns.

      There are three parts to it. First, the initial team skills: curated capability packs from the pool that are placed on the team as a whole, so every member inherits them automatically. Second, the knowledge sources: MCP servers the team can query at runtime — a wiki, a vector store, a graph database — inherited from the working environment and shown here read-only. The third part is how the team learns and shares knowledge: at the lower autonomy levels, learnings are proposed and a human reviews them before they become shared team knowledge; at the highest level, the team curates and promotes its own knowledge automatically. These are just sensible defaults every team starts on, and you can change all of them later on the Knowledge page — so for the demo we simply accept the defaults and continue.
    assert:
      do: wizard.expectKnowledgeStep
    screenshot: knowledge-step

  - action:
      do: wizard.skipKnowledge

  # ── Slide 7: Review & create ────────────────────────────────────────────────
  - id: review-step
    voiceover: |
      Finally, review — everything in one place. When we hit create, the wizard builds the whole team in one atomic transaction, each member with its own chat identity, ready for the first issue.
    narrative: |
      The final step is Review — the confirmation before anything is created. Nothing has been built yet; this is our last chance to check the whole picture in one place.

      Here we see it all laid out: the team name and ID, the working environment and repository, the exact list of agents that will be created — each with its concrete ID — plus the skills and the learning configuration. When we hit create, the wizard materialises everything in one atomic-with-rollback transaction: it sets up the shared environment, creates the team, spawns each member agent with its role-specific prompt and triggers, and provisions a Matrix user and a chat room for each. A few seconds later, we have a fully wired, running team of agents ready to react to the first issue.
    assert:
      do: wizard.expectReviewStep
      teamName: Agentic Demos
      teamId: agentic-demos
    screenshot: review-step

  # Submit and verify the per-step NDJSON progress (plumbing — navigates away).
  - action:
      do: wizard.createTeamAndExpectProgress
      teamId: agentic-demos
      roleIds: [business-analyst, developer, code-reviewer, reworker]

  # Verify the materialised team is real (UI + API) — no capture, pure assertion.
  - assert:
      do: agents.expectTeamInRail
      teamId: agentic-demos
      roleIds: [business-analyst, developer, code-reviewer, reworker]
  - assert:
      do: agents.expectMembersRunning
      teamId: agentic-demos
      roleIds: [business-analyst, developer, code-reviewer, reworker]
  - assert:
      do: agents.expectDmRooms
      teamId: agentic-demos
      roleIds: [business-analyst, developer, code-reviewer, reworker]
