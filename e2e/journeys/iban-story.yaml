journeyVersion: 1
id: iban-story
title: The IBAN Story — the label-driven SDLC loop
order: 30
# CI + live (docs/journey-spec-concept.md §3.1, §6.2). Same YAML both ways:
#   - `ci`   — runs on the fake stack (fake-claude playbooks + in-stack
#              fake-github + git-remote). It asserts the PLATFORM WIRING: that a
#              human `ready-for-implementation` label carries work hand-off to hand-off through the
#              whole Core SDLC loop. It does NOT assert agent intelligence — the
#              role "thinking" is scripted by the fake-claude playbooks
#              (agent-image/e2e/fixtures/playbooks/); the diff content is arbitrary.
#   - `live` — the SAME file, run manually against a real LLM + a sandbox repo, to
#              produce the showable walkthrough screenshots (the storyline in
#              docs/walkthrough/02-working-with-agents.md). Run + documented once
#              by a human; the CI variant is the automated regression.
lanes: [ci, live]

# The label chain crosses two poll boundaries after a full team materialisation,
# so it needs a larger per-test budget than the project default.
timeoutMs: 480000

# Precondition: reset fake-github, mint a fake GitHub token so the poller polls
# the fixture repo, create a Working Environment on the in-stack git remote, and
# materialise a full Core SDLC team FROM THE TEMPLATE BUNDLE so the members get
# the derived github-event channel triggers that carry the label chain. Fixed ids
# keep the run re-entrant on the same stack (pre-clean + teardown).
fixtures:
  - fixture: ibanStoryTeam
    params:
      teamId: iban-demo
      teamName: IBAN Demo
      envId: iban-demo-env
      envName: IBAN Demo
      repoUrl: "http://git-remote/e2e/fixture.git"
      tokenId: iban-demo-token
      branch: main

steps:
  # ── Slide 7: chapter intro (narrative-only) ─────────────────────────────────
  # `voiceover:` is the compact narration for the walkthrough video (epic #741);
  # the fuller `narrative` below feeds the deck. Screenshot capture points for the
  # remaining beats are added with T5/#745 — until then only `agent-chat` renders.
  - kind: narrative-only
    id: intro
    voiceover: |
      Now let's actually work with the team on a real change — end to end, from a vague idea in chat to a merge-ready pull request. Our example: a bank transfer form that today accepts any text in its IBAN field and always reports success. We want it to validate the recipient's IBAN before the transfer can go through.
    narrative: |
      So far we've built a team. Now let's actually work with it — end to end, from a vague idea in chat all the way to a pull request that's ready to merge.

      The example is deliberately small but realistic: a SEPA bank-transfer form today accepts any text in its IBAN field and always reports success — even for an invalid account. We want the form to validate the recipient's IBAN before the transfer can go through. Watch how the four agents of our Core SDLC team — Business Analyst, Developer, Code Reviewer and Reworker — pick this up and carry it through the process, with the human staying in control at exactly two points: approving what gets built, and performing the final merge.

      What this journey proves is the *wiring*: every hand-off in that loop is a GitHub label or event, and each one wakes the next agent automatically. The agents' "thinking" here is scripted so the run is deterministic — the point is that the platform carries the work from one role to the next with no one manually shuttling it.

  # ── Slide 8: the Agent Chat ─────────────────────────────────────────────────
  - id: agent-chat
    voiceover: |
      This is the Agent Chat, where a human talks directly to any agent. On the left is our team with its four members: Business Analyst, Code Reviewer, Developer and Reworker. In the middle is the conversation, and on the right a live view into the agent's own workspace.
    narrative: |
      This is the Agent Chat — where a human talks directly to any agent without leaving the Agent Studio. On the left is our team with its four members; each is a full agent with its own chat identity, and we can open a one-to-one conversation with any of them. We start with the Business Analyst.
    # Wait for the BA runtime to have booted before the first message (a send that
    # races container boot is silently dropped by design, agent-entrypoint.py).
    action:
      do: chat.waitForAgentReady
      agentId: iban-demo-business-analyst
    assert:
      do: chat.open
      agentId: iban-demo-business-analyst
    screenshot: agent-chat

  # ── Slides 9-11: the request → the BA files the issue ───────────────────────
  # In the storyline the BA first pushes back with six clarifying questions and
  # the human answers them; the CI variant collapses that dialogue to a single
  # message (it proves the hand-off, not the conversation) — the fake BA playbook
  # files the issue directly. The live lane shows the full six-question exchange.
  - id: describe-request
    voiceover: |
      I describe the request to the Business Analyst in plain language. Here's the first thing to appreciate: it doesn't just start writing a spec. It looks at the current form and pushes back with the six questions that genuinely need a human decision — when validation happens, what to do on an invalid IBAN, what if the service is down. I answer point by point, steering the outcome without writing a requirements document myself.
    narrative: |
      I describe the request to the Business Analyst in plain language: the transfer form should validate the IBAN. In the live demo the BA pushes back first — it asks the six product questions that genuinely need a human decision (validate on blur or submit? block or warn? what if the service is down? …) — and only then, with my answers in hand, finalizes the work item.

      The result is a GitHub issue written in two layers: a plain-language Human Section any stakeholder can read, and an Agent Section with a problem statement, scope and numbered, testable acceptance criteria. It also states the hand-off rule: add the `ready-for-implementation` label when you want the Developer to pick it up. Until then, nothing happens — that's the first of the two human control points.
    action:
      do: chat.send
      text: "Our SEPA transfer form accepts any text in the IBAN field and always reports success. It should validate the IBAN against a public service before the transfer can go through."
    screenshot: describe-request

  # Hop 1 — BA → issue: the issue now exists on (fake) GitHub.
  - id: issue-filed
    voiceover: |
      With my decisions, the Business Analyst files the issue in GitHub. It's written in two layers: a plain-language human section any stakeholder can read, and a full agent section with the problem, scope, and numbered, testable acceptance criteria for the delivery team.
    assert:
      do: gh.expectIssueExists
      repo: e2e/fixture
    screenshot: issue-filed

  # ── Slide 12: control point 1 — the human applies `ready-for-implementation` ─
  - id: human-approves
    voiceover: |
      Here's the human control point. On GitHub I open the labels menu and apply ready-for-implementation. This label is a deliberate human gate — no agent can set it. By adding it, I approve what gets built, and the moment I do, it becomes an event the platform is listening for.
    narrative: |
      This is the human go-signal: I open the Labels menu and apply `ready-for-implementation`. This label is deliberately a human gate — no agent sets it. By adding it, I'm approving what gets built. The moment I do, it becomes a GitHub event the platform is listening for — and that event is what wakes the next agent in the chain.
    # The test acts as the human here — applying `ready-for-implementation` to the
    # issue the BA just filed (number-agnostic: it labels the newest issue in the
    # repo). This label is the Developer's derived github-event channel trigger
    # (core-sdlc: developer reacts to issues.labeled=ready-for-implementation).
    action:
      do: gh.applyLabelToLatestIssue
      repo: e2e/fixture
      label: ready-for-implementation

  # Hop 2 — issues.labeled woke the Developer: the trigger.fired event lands on its
  # own session SSE stream (the "trigger visible in its chat"). Asserted on its own
  # step so the capture below can wait for the *finished* work instead.
  - id: developer-triggered
    action:
      do: chat.open
      agentId: iban-demo-developer
    assert:
      do: chat.expectTriggerFired
      agentId: iban-demo-developer
      # This hop crosses a GitHub-poll boundary (issues.labeled → poller → wake);
      # give it more than the 60 s default so a slow poll tick isn't a flake.
      timeoutMs: 120000

  # ── Slide 13: the Developer wakes and delivers ──────────────────────────────
  - id: developer-wakes
    voiceover: |
      The ready-for-implementation label fired a trigger, and the Developer woke up automatically — no one opened this chat to prompt it. It implemented the whole change on its own: a testable client, the validation states wired into the form, passing tests, a green build — then opened a pull request and labelled it ready-for-review. The Developer never reviews or merges its own work.
    narrative: |
      The `ready-for-implementation` label fired a GitHub trigger, and the Developer agent woke up automatically — the trigger event is visible right in its chat, delivered over the session stream. No one opened this chat to prompt it; the label alone set it in motion. The Developer then does the whole implementation on its own — a feature branch, the change, tests — opens a Pull Request and labels it `ready-for-review`. The hand-off is again just a label, and that label is what will wake the Code Reviewer. The Developer never reviews or merges its own work.
    # The Developer chat is already open (previous step). WAIT for its PR (Hop 3 —
    # Developer → PR carrying `ready-for-review`); the chat fills in live over SSE
    # during that wait, so the capture shows the finished implementation.
    assert:
      do: gh.expectPrExists
      repo: e2e/fixture
      hasLabel: ready-for-review
    screenshot: developer-wakes

  # ── Slide 14: the Code Reviewer verifies ────────────────────────────────────
  - id: reviewer-verdict
    voiceover: |
      Same pattern again: the ready-for-review label woke the Code Reviewer. It checked out the branch, reviewed the full diff in context, and went through the acceptance criteria one by one. Its verdict: all met, tests pass, build green — and it applies ready-to-merge, noting that a human performs the merge.
    narrative: |
      Same pattern again: the `ready-for-review` label on the pull request fired a trigger, and the Code Reviewer wakes up on its own. It reviews the change against the issue's acceptance criteria, posts a structured review comment, and applies `ready-to-merge`. And here's the important line: a human performs the merge. The Code Reviewer recommends; it never merges.
    # Hop 4 — the reviewer posted its verdict comment on the PR.
    action:
      do: chat.open
      agentId: iban-demo-code-reviewer
    assert:
      do: gh.expectComment
      repo: e2e/fixture
      bodyIncludes: "ready to merge"
    screenshot: reviewer-verdict

  # Hop 5 — the reviewer's `ready-to-merge` hand-off label is on the PR.
  - id: ready-to-merge
    assert:
      do: gh.expectPrExists
      repo: e2e/fixture
      hasLabel: ready-to-merge

  # ── Slide 15: control point 2 — the merge (narrative-only) ──────────────────
  - kind: narrative-only
    id: merge-recap
    voiceover: |
      And this is where we land: a pull request ready to merge, cleanly closing the issue. From a one-line idea in chat, the team produced a well-specified issue, a complete tested implementation, and a reviewed, merge-ready pull request — each hand-off triggered automatically by a label, with the human in control at exactly the two points that matter.
    narrative: |
      And this is where we land: a pull request marked ready to merge, carrying the `ready-to-merge` label the Code Reviewer applied, closing the issue. The merge itself is the human's second control point — deliberately out of scope for this automated loop (matching the happy path, which skips the rework loop).

      Step back and look at what happened. From a one-line idea in a chat, a team of agents produced a specified issue, an implementation and a reviewed, merge-ready pull request — hand-off to hand-off, each step triggered automatically by a GitHub label, no one manually shuttling work between agents. The human stayed in control at exactly the two points that matter. That's the promise of working with agents in the Agent Studio.
