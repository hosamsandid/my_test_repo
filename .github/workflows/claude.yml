name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# id-token: write is intentionally omitted: this workflow authenticates to the
# LLM proxy with a static secret (ANTHROPIC_AUTH_TOKEN), not OIDC, so no OIDC
# token minting is required. Re-add it only alongside a documented OIDC use.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    # Only run for a genuine human whose comment mentions @claude AND who is a
    # trusted member of this repo. author_association is OWNER/MEMBER/COLLABORATOR
    # only (never CONTRIBUTOR/FIRST_TIME_CONTRIBUTOR/NONE), and user.type == 'User'
    # excludes bots and GitHub Apps that happen to mention @claude. Without this
    # gate any account able to comment could invoke the job's write permissions.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      ) &&
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        env:
          ANTHROPIC_BASE_URL: "https://litellm.sandbox.starplatform.cloud"
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-7
          ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-4-6
          ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
