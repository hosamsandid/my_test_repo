# The admin-console half of the toolchain image prefix (#1941 AC11).
#
# WHY A SECOND FILE. `patch-agent-image.yaml` is a strategic-merge patch, and a
# strategic-merge patch addresses exactly ONE object (its own
# apiVersion/kind/metadata.name) — it cannot reach a second Deployment. The
# prefix has to reach both: the orchestrator resolves a toolchain to the image
# it spawns from, and the console resolves the same manifest to the image
# reference an operator reads in the install review and stores in
# /workspace/toolchains/index.json. Splitting the value across two overlays
# would make them disagree, which is why both patches carry the identical
# string and render-check.sh asserts the pair count rather than a single hit.
#
# `namespace: agent-studio` is the BASE namespace on purpose — the overlay's
# namespace transformer rewrites it to agent-studio-preprod, exactly as it does
# for patch-agent-image.yaml (a patch must match the object it patches BEFORE
# the transformer runs).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-console
  namespace: agent-studio
spec:
  template:
    spec:
      containers:
        - name: admin-console
          env:
            - name: AEE_TOOLCHAIN_IMAGE_PREFIX
              value: europe-west3-docker.pkg.dev/acn-projectroots/agent-studio
            # Placeholder, rewritten to the release tag by set-images.sh at
            # deploy time (never committed pinned — the checked-in value must
            # keep `kubectl kustomize` rendering, exactly like every newTag:).
            - name: AEE_TOOLCHAIN_IMAGE_TAG
              value: latest
