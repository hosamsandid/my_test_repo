# Dependabot — supply-chain hardening (#2458).
#
# Surfaces known-vulnerable npm dependencies and out-of-date GitHub Actions as
# review-ready PRs. This is the chosen mitigation for CI's deliberate
# `npm install --no-audit` speed optimisation (see ci.yml): audit stays off in
# CI, Dependabot does the alerting instead.
#
# One `npm` entry per directory that owns a package.json, plus the
# `github-actions` ecosystem (which also keeps the SHA-pinned `uses:` steps in
# .github/workflows/*.yml fresh — Dependabot bumps the pinned SHA *and* the
# trailing version comment together). Updates are REVIEWED and merged manually;
# no auto-merge is configured here.
#
# HOW TO BUMP A PIN INTENTIONALLY (SHAs / digests): see docs/supply-chain-pins.md.
# Adding a new package.json? Add a matching `npm` block below, or its deps go
# unmonitored.
version: 2
updates:
  # ── GitHub Actions (keeps the SHA pins in .github/workflows/*.yml current) ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # ── Docker (keeps agent-image/Dockerfile's digest-pinned base fresh) ────────
  - package-ecosystem: docker
    directory: /agent-image
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5

  # ── npm — one block per directory with a package.json ──────────────────────
  - package-ecosystem: npm
    directory: /orchestrator
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

