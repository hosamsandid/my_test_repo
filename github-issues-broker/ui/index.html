<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitHub Issues</title>
  <script>
    // Follow the console's theme before first paint (avoid a flash). This iframe
    // is proxied on the console's own origin, so it shares localStorage: the
    // console writes the active theme to `eb-theme` (see admin-console useTheme).
    // app.js keeps it in sync on live toggles via the `storage` event.
    (function () {
      try {
        var valid = ['admin-dark', 'admin-light', 'high-contrast'];
        var stored = localStorage.getItem('eb-theme');
        if (stored && valid.indexOf(stored) >= 0) {
          document.documentElement.dataset.theme = stored;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.dataset.theme = 'admin-light';
        } else {
          document.documentElement.dataset.theme = 'admin-dark';
        }
      } catch (e) { document.documentElement.dataset.theme = 'admin-dark'; }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="toolbar">
    <div class="title">
      <h1>GitHub Issues</h1>
      <span class="sub">View issues and manage labels without leaving the studio</span>
    </div>
    <span class="spacer"></span>
    <label class="field">
      <span>Team</span>
      <select id="teamSelect"></select>
    </label>
    <label class="field">
      <span>Repository</span>
      <select id="repoSelect"></select>
    </label>
    <label class="field">
      <span>State</span>
      <select id="stateSelect">
        <option value="open">Open</option>
        <option value="closed">Closed</option>
        <option value="all">All</option>
      </select>
    </label>
    <button class="btn" id="refreshBtn" title="Reload issues">Refresh</button>
  </div>

  <div class="banner hidden" id="banner"></div>

  <div class="layout">
    <div class="list-pane" id="listPane">
      <div class="list-search">
        <input id="searchInput" type="search" autocomplete="off"
               placeholder="Filter by title…" aria-label="Filter issues by title" />
      </div>
      <div class="skeleton hidden" id="listSkeleton" aria-busy="true"></div>
      <ul class="issue-list" id="issueList"></ul>
      <div class="empty hidden" id="listEmpty"></div>
      <div class="pager hidden" id="pager">
        <button class="btn ghost" id="prevBtn" disabled>‹ Previous</button>
        <span class="pager-info" id="pagerInfo"></span>
        <button class="btn ghost" id="nextBtn" disabled>Next ›</button>
      </div>
    </div>

    <div class="detail-pane" id="detailPane">
      <div class="detail-empty" id="detailEmpty">Select an issue to see its details.</div>
      <div class="detail hidden" id="detail"></div>
    </div>
  </div>

  <div class="err hidden" id="err"></div>

  <script src="markdown.js"></script>
  <script src="issue-list.js"></script>
  <script src="app.js"></script>
</body>
</html>
