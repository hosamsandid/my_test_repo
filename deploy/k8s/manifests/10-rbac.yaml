# RBAC for the container-runtime seam (orchestrator/spawn-kubernetes-pod.js):
# the orchestrator creates one agent Pod per agent through the Kubernetes API.
#
# - orchestrator SA: namespaced pods CRUD + pods/log. Nothing cluster-scoped,
#   no watch (the spawner polls).
# - agent SA: identity only — automountServiceAccountToken: false means agent
#   pods get NO Kubernetes API access at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-studio-orchestrator
  namespace: agent-studio
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-studio-agent
  namespace: agent-studio
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-studio-orchestrator
  namespace: agent-studio
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-studio-orchestrator
  namespace: agent-studio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-studio-orchestrator
subjects:
  - kind: ServiceAccount
    name: agent-studio-orchestrator
    namespace: agent-studio
