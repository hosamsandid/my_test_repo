<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitHub Issues</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="toolbar">
    <div class="title">
      <h1>GitHub Issues</h1>
      <span class="sub">View issues and manage labels without leaving the studio</span>
    </div>
    <span class="spacer"></span>
    <label class="field">
      <span>Team</span>
      <select id="teamSelect"></select>
    </label>
    <label class="field">
      <span>Repository</span>
      <select id="repoSelect"></select>
    </label>
    <label class="field">
      <span>State</span>
      <select id="stateSelect">
        <option value="open">Open</option>
        <option value="closed">Closed</option>
        <option value="all">All</option>
      </select>
    </label>
    <button class="btn" id="refreshBtn" title="Reload issues">Refresh</button>
  </div>

  <div class="banner hidden" id="banner"></div>

  <div class="layout">
    <div class="list-pane" id="listPane">
      <div class="skeleton hidden" id="listSkeleton" aria-busy="true"></div>
      <ul class="issue-list" id="issueList"></ul>
      <div class="empty hidden" id="listEmpty"></div>
      <div class="list-more hidden" id="listMore">
        <button class="btn ghost" id="moreBtn">Load more</button>
      </div>
    </div>

    <div class="detail-pane" id="detailPane">
      <div class="detail-empty" id="detailEmpty">Select an issue to see its details.</div>
      <div class="detail hidden" id="detail"></div>
    </div>
  </div>

  <div class="err hidden" id="err"></div>

  <script src="app.js"></script>
</body>
</html>
