<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jira</title>
  <script>
    // Follow the console's theme before first paint (this iframe is proxied on
    // the console's own origin, so it shares localStorage['eb-theme']).
    (function () {
      try {
        var valid = ['admin-dark', 'admin-light', 'high-contrast'];
        var stored = localStorage.getItem('eb-theme');
        if (stored && valid.indexOf(stored) >= 0) {
          document.documentElement.dataset.theme = stored;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.dataset.theme = 'admin-light';
        } else {
          document.documentElement.dataset.theme = 'admin-dark';
        }
      } catch (e) { document.documentElement.dataset.theme = 'admin-dark'; }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="toolbar">
    <div class="section-title" style="margin:0;">Jira</div>
    <select id="team" class="field" style="max-width:220px;" hidden></select>
    <span class="spacer"></span>
    <a id="adminLink" class="btn ghost" href="admin" hidden>Watch config</a>
    <button id="refresh" class="btn">Refresh</button>
  </div>

  <div class="view-tabs">
    <button id="tab-board" class="view-tab is-active" data-view="board">Board</button>
    <button id="tab-activity" class="view-tab" data-view="activity">Activity</button>
  </div>

  <div id="err" class="err" hidden></div>

  <!-- ── Board view ─────────────────────────────────────────────────────── -->
  <div id="view-board" class="view">
    <div class="layout">
      <div class="list-pane">
        <div class="toolbar sub">
          <select id="project" class="field" style="max-width:220px;"></select>
          <input id="status" class="field list-search" placeholder="filter by status…" style="max-width:200px;" />
        </div>
        <div class="section-title">Issues</div>
        <div id="issues" class="issue-list"><div class="empty">Pick a project.</div></div>
      </div>

      <div class="detail-pane">
        <div class="watch-head">
          <div class="section-title" style="margin:0;">Watching</div>
          <span id="watchRollup" class="health-pill" hidden></span>
        </div>
        <div id="watches" class="watch-cards"><div class="empty">—</div></div>

        <div class="section-title" style="margin-top:1.4rem;">Inbox <span id="inboxCount" class="hint"></span></div>
        <div id="inbox" class="detail"><div class="empty">Nothing queued.</div></div>
      </div>
    </div>
  </div>

  <!-- ── Activity view ─────────────────────────────────────────────────── -->
  <div id="view-activity" class="view" hidden>
    <div class="layout activity-layout">
      <div class="list-pane">
        <div class="watch-head">
          <div class="section-title" style="margin:0;">Watch health</div>
          <span id="watchRollup2" class="health-pill" hidden></span>
        </div>
        <div id="watchStrip" class="watch-strip"><div class="empty">—</div></div>
      </div>

      <div class="detail-pane">
        <div class="activity-controls">
          <div id="kindFilters" class="chip-row"></div>
          <div id="typeFilters" class="chip-row"></div>
          <span class="spacer"></span>
          <div class="seg" id="scopeToggle">
            <button class="seg-btn is-active" data-scope="watched">Watched</button>
            <button class="seg-btn" data-scope="all">All activity</button>
          </div>
        </div>
        <p class="hint" style="margin:0 0 12px;">
          Every event the poller saw in a watched project, and what it did with it.
          Kept 14 days, independent of the agent inbox.
        </p>
        <div id="activity" class="activity-list"><div class="empty">No activity yet.</div></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
