# RBAC for the container-runtime seam (orchestrator/spawn-kubernetes-pod.js):
# the orchestrator creates one agent Pod per agent through the Kubernetes API.
#
# - orchestrator SA: namespaced pods CRUD + pods/log + pods/exec. Nothing
#   cluster-scoped, no watch (the spawner polls). pods/exec backs the
#   context-mount browse/write transport (orchestrator/pod-exec.js, #1319).
#   Plugin sidecars (#1565) add apps/deployments + services + PVCs (a plugin
#   broker is a Deployment + Service + state PVC — spawn-kubernetes-plugin.js),
#   plus networkpolicies for the separable broker-plugin reachability follow-up.
#   All namespaced — still nothing cluster-scoped.
# - agent SA: identity only — automountServiceAccountToken: false means agent
#   pods get NO Kubernetes API access at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-studio-orchestrator
  namespace: agent-studio
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-studio-agent
  namespace: agent-studio
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-studio-orchestrator
  namespace: agent-studio
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # WebSocket exec (pod-exec.js) upgrades a GET, which the apiserver authorizes
  # as the "get" verb; SPDY clients (kubectl) POST and need "create". Grant both
  # so the transport choice never becomes an RBAC surprise.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  # Plugin broker sidecars (#1565): each installed UI-bearing plugin becomes a
  # Deployment + Service + state PVC (spawn-kubernetes-plugin.js). No watch — the
  # orchestrator reconciles on install/uninstall and at boot, never streams.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  # networkpolicies back the separable broker-plugin reachability follow-up (a
  # UI-only plugin needs none); granted now so that work needs no RBAC change.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-studio-orchestrator
  namespace: agent-studio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-studio-orchestrator
subjects:
  - kind: ServiceAccount
    name: agent-studio-orchestrator
    namespace: agent-studio
